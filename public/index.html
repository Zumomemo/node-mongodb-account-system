<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Account Workshop</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .switch { text-align: center; margin-top: 10px; cursor: pointer; color: blue; }
    </style>
</head>
<body>
    <div id="register-box">
        <h2>สมัครสมาชิก</h2>
        <input type="text" id="reg-username" placeholder="Username">
        <input type="password" id="reg-password" placeholder="Password">
        <input type="text" id="reg-name" placeholder="ชื่อ-นามสกุล">
        <input type="email" id="reg-email" placeholder="Email">
        <button onclick="register()">Register</button>
        <div class="switch" onclick="toggleForm()">มีบัญชีอยู่แล้ว? เข้าสู่ระบบ</div>
    </div>

    <div id="login-box" style="display:none;">
        <h2>เข้าสู่ระบบ</h2>
        <input type="text" id="login-username" placeholder="Username">
        <input type="password" id="login-password" placeholder="Password">
        <button onclick="login()">Login</button>
        <div class="switch" onclick="toggleForm()">ยังไม่มีบัญชี? สมัครสมาชิก</div>
    </div>

    <script>
        function toggleForm() {
            const regBox = document.getElementById('register-box');
            const loginBox = document.getElementById('login-box');
            regBox.style.display = regBox.style.display === 'none' ? 'block' : 'none';
            loginBox.style.display = loginBox.style.display === 'none' ? 'block' : 'none';
        }

        async function register() {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('reg-username').value,
                    password: document.getElementById('reg-password').value,
                    name: document.getElementById('reg-name').value,
                    email: document.getElementById('reg-email').value
                })
            });
            const data = await res.json();
            alert(data.message);
        }

        async function login() {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('login-username').value,
                    password: document.getElementById('login-password').value
                })
            });
            const data = await res.json();
            if (res.ok) alert(data.message + " ยินดีต้อนรับ คุณ " + data.name);
            else alert(data.message);
        }
    </script>
</body>
</html>
